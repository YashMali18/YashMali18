name: Generate Snake

on:
  # every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # lets you press "Run workflow" manually in the Actions tab
  workflow_dispatch:
  # re-run whenever main changes (for example when you edit README.md)
  push:
    branches:
      - main

# needed so the workflow can push the generated SVGs to the "output" branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: YashMali18
          outputs: |
            dist/github-snake.svg?color_snake=0891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=10B981&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
